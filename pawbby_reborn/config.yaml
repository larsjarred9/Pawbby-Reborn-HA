name: "Pawbby Reborn"
description: "Local Tuya device listener and dashboard for Pawbby smart litter boxes."
version: "0.7.1"
slug: "pawbby_reborn"
url: "https://github.com/larsjarred9/Pawbby-Reborn"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
# host_network is required to receive local Tuya UDP broadcast packets (port 6666/6667)
host_network: true
# Explicitly enable AppArmor for improved security sandboxing
apparmor: true
webui: "http://[HOST]:[PORT:3333]"
environment:
  DATABASE_URL: "file:/data/pawbby.db"
  APP_HOST: "0.0.0.0"
  APP_PORT: "3333"
options: {}
schema: {}
